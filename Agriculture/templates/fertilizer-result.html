{% extends 'base.html' %} 
{% block body %}
<head>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
    
<style>
    body, h1, h2, h3, h4, h5, p, a, span, nav {
        font-family: "Times New Roman", Times, serif !important;
    }

    h1, h2 {
        font-size: 3rem; /* Larger headers */
    }

    h3, h4 {
        font-size: 2rem;
    }

    p, a {
        font-size: 1.5rem; /* Slightly larger text */
    }

    .hero-image {
        background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("/static/images/4.jpeg");
        height: 60%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
        color: white;
    }

    .hero-text {
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .nav-link {
        font-size: 20px;
        font-weight: bold;
    }

    .footer-copyright {
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
    }

    .card {
        border: 2px solid rgb(234, 32, 9);
    }

    p.text-center {
        font-size: 24px;
        font-style: italic;
        color: rgb(234, 32, 9);
    }
</style>

<!-- About us section -->
<div class="hero-image">
    <div class="hero-text">
        <p class="breadcrumbs text-white font-weight-bold">
            <span class="mr-2"><a href="{{ url_for('hello_world') }}" class="text-white">🏠 Home /</a></span>
            <span>🌾 Crop Result</span>
        </p>
        <h1 class="mb-0 bread font-weight-bold">🌟 Find Out Which Fertilizer to Use 🌟</h1>
    </div>
</div>
<!-- /About us section -->

<!-- Second nav -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav mx-auto">
            <a class="nav-item nav-link active" href="{{ url_for('dashboard') }}">📊 Dashboard</a>
            <a class="nav-item nav-link" href="{{ url_for('crop_recommend') }}">🌱 Crop</a>
            <a class="nav-item nav-link" href="{{ url_for('fertilizer_recommendation') }}">💊 Fertilizer</a>
            <a class="nav-item nav-link" href="{{ url_for('disease_prediction') }}">🩺 Disease</a>
            <a class="nav-item nav-link" href="{{ url_for('logout') }}">🚪 Logout</a>
        </div>
    </div>
</nav>

<!-- Prediction -->
<div class="container py-4 mx-auto my-50 h-10">
    <div class="row">
        <div class="col-sm py-3">
            <div class="card card-body shadow p-4 mb-5 bg-white rounded text-center">
                <p class="m-1 p-3">👉 {{ recommendation }}</p>
            </div>
        </div>
    </div>
</div>

<!-- Footer section -->
<footer class="page-footer font-small blue pt-5">
    <div class="footer-copyright text-center py-4">
        <h5>🌿 Precision Agriculture Using Machine Learning & IoT 🌿</h5>
        <div>🌎 <b>Go Green...</b> 💚</div>
    </div>
</footer>
{% endblock %}
